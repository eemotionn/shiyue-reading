# Example Nginx config for the reading collection static site.
# Point root to the built dist/ directory after `npm run build`.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # After obtaining certificates (e.g. certbot), prefer HTTPS and redirect HTTP.
    # return 301 https://$host$request_uri;

    root /var/www/blog-essay;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Optional: cache static assets
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

